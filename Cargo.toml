[package]
name = "rl-uploader"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Local Rocket League replay archive and ballchasing uploader"

[dependencies]
base64 = "0.22"
ctrlc = "3.5"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
httpdate = "1.0"
rand = "0.9"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2.5"
webbrowser = "1.0"
x509-parser = "0.18"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Console", "Win32_Networking_WinSock"] }

[profile.release]
lto = "thin"
strip = true
