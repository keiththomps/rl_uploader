[package]
name = "rl-uploader"
version = "0.9.3"
default-run = "rl-uploader"
edition = "2024"
rust-version = "1.88"
description = "Local Rocket League replay archive and ballchasing uploader"

[dependencies]
base64 = "0.22"
ctrlc = "3.5"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
httpdate = "1.0"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2.5"
webbrowser = "1.0"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true
